spring:
  application:
    name: y-api-interface
  config:
    import:
      # optional: Nacos 上没有这份配置/连不上时也不影响启动,本地 yml 照常生效
      - optional:nacos:${spring.application.name}.yml
  # session
  session:
    store-type: redis
    # 30 days expire
    timeout: 2592000
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        username: nacos
        password: nacos
        metadata:
          context-path: /interfaceInfo
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/yapi
    username: root
    password: 123456
  # redis
  redis:
    database: 5
    host: localhost
    port: 6379
    timeout: 5000
#    password: 123456
  profiles:
    active: local
server:
  port: 8211
  servlet:
    context-path: /interfaceInfo
    # 30 days expire
    session:
      cookie:
        max-age: 2592000
        path: /
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
# 接口文档配置
knife4j:
  enable: true
  openapi:
    title: "接口文档"
    version: 1.0
    group:
      default:
        api-rule: package
        api-rule-resources:
          - cn.y.yapiinterface.controller
# 以下配置指定了应用的名称、使用的协议（Dubbo）、注册中心的类型（Nacos）和地址
dubbo:
  registry:
    address: nacos://127.0.0.1:8848
    parameters:
      username: nacos
      password: nacos
    register-mode: instance
  application:
    name: dubbo-y-api-interface
    qos-enable: true
    qos-port: 0 # 设置为 0，系统会自动找一个空闲端口
  # 指定使用 Dubbo 协议，且端口设置为 -1，表示随机分配可用端口
  protocol:
    name: dubbo
    port: -1
  consumer:
    timeout: 60000
  provider:
    timeout: 60000