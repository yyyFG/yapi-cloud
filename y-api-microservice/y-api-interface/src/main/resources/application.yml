spring:
  application:
    name: y-api-interface
  profiles:
    active: prod
  config:
    import:
      - optional:classpath:application-${spring.profiles.active}.yml
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.yml
  # session
  session:
    store-type: redis
    # 30 days expire
    timeout: 2592000
  # Servlet 配置
  servlet:
    # 文件上传相关配置项
    multipart:
      max-file-size: 16MB # 单个文件大小
      max-request-size: 32MB # 设置总上传的文件大小
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
# 接口文档配置
knife4j:
  enable: true
  openapi:
    title: "接口文档"
    version: 1.0
# openapi3(springdoc) 模式下分组由 springdoc 管理，knife4j 的 group 配置不生效
springdoc:
  group-configs:
    - group: default
      packages-to-scan: cn.y.yapiinterface.controller