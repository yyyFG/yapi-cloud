spring:
  application:
    name: y-api-gateway
  profiles:
    active: prod
  config:
    import:
      - optional:classpath:application-${spring.profiles.active}.yml
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.yml
  cloud:
    gateway:
      routes:
        - id: y-api-user
          uri: lb://y-api-user
          predicates:
            - Path=/user/**
        - id: y-api-interface
          uri: lb://y-api-interface
          predicates:
            - Path=/interfaceInfo/**
        - id: y-api-userinterface
          uri: lb://y-api-userinterface
          predicates:
            - Path=/userInterface/**
        # 在线调用第三方接口的入口：CustomGlobalFilter 校验 AK/SK 后按接口真实地址转发
        - id: api-invoke
          uri: http://localhost
          predicates:
            - Path=/api/**
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
            exposedHeaders: "*"
  main:
    web-application-type: reactive
logging:
  level:
    org:
      springframework:
        cloud:
          gateway: trace
knife4j:
  gateway:
    enabled: true
    strategy: discover  # 服务发现模式
    discover:
      enabled: true    # 启动服务发现
      version: openapi3
      excluded-services: y-api-gateway