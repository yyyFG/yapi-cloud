spring:
  cloud:
    nacos:
      config:
        server-addr: 192.168.1.61:8848
        username: nacos
        password: nacos
      discovery:
        server-addr: 192.168.1.61:8848
        username: nacos
        password: nacos
        metadata:
          context-path: /userInterface
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.1.61:3306/yapi
    username: root
    password: 123456
  # redis
  redis:
    database: 5
    host: 192.168.1.61
    port: 6379
    timeout: 5000
#    password: 123456
  rabbitmq:
    host: 192.168.1.61
    port: 5672
    password: admin
    username: admin
server:
  port: 8212
  servlet:
    context-path: /userInterface
    # 30 days expire
    session:
      cookie:
        max-age: 2592000
        path: /
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
knife4j:
  enable: false    # 生产关闭接口文档，收敛暴露面
# 以下配置指定了应用的名称、使用的协议（Dubbo）、注册中心的类型（Nacos）和地址
dubbo:
  registry:
    address: nacos://192.168.1.61:8848
    parameters:
      username: nacos
      password: nacos
    register-mode: instance
  application:
    name: dubbo-y-api-userinterface
    qos-enable: true
    qos-port: 0 # 设置为 0，系统会自动找一个空闲端口
  # 指定使用 Dubbo 协议，且端口设置为 -1，表示随机分配可用端口
  protocol:
    name: dubbo
    port: -1
  consumer:
    timeout: 60000
  provider:
    timeout: 60000